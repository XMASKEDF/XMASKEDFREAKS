name: Security and build checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
        with:
          version: 11.12.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm rebuild sharp
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:security
      - run: pnpm run test:admin-auth
      - run: pnpm run test:hosted-payments
      - run: pnpm run build
